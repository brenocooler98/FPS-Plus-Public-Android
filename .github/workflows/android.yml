name: Android Build

on:
  push:
    paths-ignore:
      - docs/**
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
      HXCPP_CACHE_MB: 4096
      NDK_VERSION: 29.0.13113456
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            build-tools;35.0.0
            platforms;android-29
            platforms;android-35
            ndk;29.0.13113456

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Haxelib
        run: |
          haxelib --never --global install haxelib 4.1.0
          haxelib --global set haxelib 4.1.0
          haxelib --never --global git haxelib https://github.com/FunkinCrew/haxelib.git funkin-patches --skip-dependencies
          haxelib --never --global git hmm https://github.com/FunkinCrew/hmm funkin-patches
          haxelib --never newrepo

      - name: Restore Haxelib Cache
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-android-${{ hashFiles('hmm.json') }}

      - name: Install Dependencies
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: |
          git config --global advice.detachedHead false
          haxelib --global run hmm install -q
          cd .haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml

      - name: List Haxelibs
        run: haxelib list

      - name: Restore Hxcpp Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HXCPP_COMPILE_CACHE }}
          key: hxcpp-android-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            hxcpp-android-${{ github.ref_name }}-
            hxcpp-android-

      - name: Restore Lime Ndll Cache
        id: cache-lime
        uses: actions/cache@v4
        with:
          path: |
            .haxelib/lime/git/ndll/Linux64
            .haxelib/lime/git/ndll/Android
            .haxelib/lime/git/ndll/Android64
          key: lime-ndll-${{ hashFiles('hmm.json') }}-${{ env.NDK_VERSION }}

      - name: Install Native Dependencies
        if: steps.cache-lime.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libx11-dev libxi-dev libxext-dev libxinerama-dev libxrandr-dev libgl-dev libgl1-mesa-dev libasound2-dev libpulse-dev libwayland-dev wayland-protocols libxkbcommon-dev libegl-dev libdrm-dev libgbm-dev libdecor-0-dev libxcursor-dev libxss-dev libxxf86vm-dev libudev-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libsndio-dev libjack-jackd2-dev

      - name: Rebuild Lime For Linux
        if: steps.cache-lime.outputs.cache-hit != 'true'
        run: haxelib run lime rebuild linux -64 -release -nocffi

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_SDK_ROOT/ndk/$NDK_VERSION
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Rebuild Lime For Android
        if: steps.cache-lime.outputs.cache-hit != 'true'
        run: haxelib run lime rebuild android -release -nocffi

      - name: Build
        run: haxelib run lime build android -release
        timeout-minutes: 120

      - name: Sign APK
        run: |
          BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/35.0.0
          APK=$(find export/release/android/bin/app/build/outputs/apk -name "*.apk" | head -1)
          keytool -genkeypair -keystore ci.keystore -storepass fpsplusci -keypass fpsplusci -alias fpsplus -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FPS Plus"
          $BUILD_TOOLS/zipalign -f -p 4 "$APK" aligned.apk
          mkdir -p output
          $BUILD_TOOLS/apksigner sign --ks ci.keystore --ks-pass pass:fpsplusci --key-pass pass:fpsplusci --out output/FPSPlus.apk aligned.apk
          $BUILD_TOOLS/apksigner verify output/FPSPlus.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FPSPlus-Android
          path: output/FPSPlus.apk
          if-no-files-found: error
